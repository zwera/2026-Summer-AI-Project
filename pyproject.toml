[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "police-case-law-ai-bot"
version = "0.1.0"
description = "경찰 판례·법령 AI 봇 - 목업 RAG 시연 웹 애플리케이션 및 실제 RAG 파이프라인 (Python 기준 구현)"
readme = "README.md"
# google-genai/fastapi/uvicorn/python-multipart가 Python 3.10+를 요구하므로 하한을 3.10으로 올린다.
requires-python = ">=3.10,<3.15"
license = { text = "Proprietary" }
# 목업 시연 계층(domain/, data/, app/, fixtures/, web/server.py)은 여전히 표준 라이브러리만
# 사용하는 것을 원칙으로 한다. 아래 dependencies는 실제 RAG 파이프라인(rag/, web/rag_server.py)
# 전용이며 목업 시연 계층의 임포트 경로에서는 사용하지 않는다.
dependencies = [
    "chromadb==1.5.9",
    "google-genai==2.16.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pypdf==6.14.2",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "hypothesis==6.141.1",
    "mypy==1.19.1",
]

[tool.setuptools]
packages = ["domain", "data", "app", "web", "fixtures", "rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
files = ["domain", "data", "app", "web", "fixtures", "tests"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# 실제 RAG 파이프라인(rag/)은 목업 시연 계층과 별도로 완화된 설정으로 검사한다.
# chromadb/google-genai 등 외부 SDK의 타입 스텁이 불완전하므로 strict를 적용하지 않는다.
[[tool.mypy.overrides]]
module = "rag.*"
strict = false
disallow_untyped_defs = false
disallow_untyped_decorators = false
ignore_missing_imports = true

# rag/가 의존하는 서드파티 SDK(chromadb 등이 다시 numpy 같은 무거운 스택을 끌어옴)는
# 타입 스텁 버전이 mypy python_version(3.9) 문법과 맞지 않아 검사 자체가 실패할 수 있으므로,
# 이들 모듈 안으로는 타입 추적을 하지 않는다(rag/ 자체 코드만 검사).
[[tool.mypy.overrides]]
module = [
    "chromadb",
    "chromadb.*",
    "google",
    "google.genai",
    "google.genai.*",
    "fastapi",
    "fastapi.*",
    "starlette",
    "starlette.*",
    "anyio",
    "anyio.*",
    "uvicorn",
    "uvicorn.*",
    "pypdf",
    "pypdf.*",
    "dotenv",
    "dotenv.*",
    "numpy",
    "numpy.*",
    "exceptiongroup",
    "exceptiongroup.*",
]
ignore_missing_imports = true
follow_imports = "skip"
# mypy는 기본적으로 .pyi 스텁 파일에는 follow_imports를 적용하지 않는다(스텁은 항상
# 따라감). numpy가 배포하는 __init__.pyi가 PEP 695 `type` 문법(Python 3.12+ 전용)을
# 사용해 python_version=3.9 파싱을 깨뜨리므로, follow_imports_for_stubs를 전역으로
# 켜서 위 follow_imports="skip"이 스텁 파일에도 실제로 적용되게 한다.
follow_imports_for_stubs = true
